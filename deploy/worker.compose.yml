services:
  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    env_file: /etc/sivirinia/worker.env
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
