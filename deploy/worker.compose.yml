services:
  worker:
    image: sivirinia-worker:staging
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    env_file: ${WORKER_ENV_FILE:-/etc/sivirinia/worker.env}
    environment:
      WORKER_CA_FILE: /run/secrets/worker-ca.crt
    volumes:
      - type: bind
        source: ${WORKER_CA_HOST_FILE:-/etc/ssl/certs/ca-certificates.crt}
        target: /run/secrets/worker-ca.crt
        read_only: true
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
