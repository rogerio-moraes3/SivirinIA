project_id = "sivirinia"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 15
[db.seed]
enabled = false
[studio]
enabled = false
port = 54323
[inbucket]
enabled = true
port = 54324
[storage]
enabled = false
file_size_limit = "10MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
